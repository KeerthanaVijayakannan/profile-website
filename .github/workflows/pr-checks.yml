
name: PR Quality Checks

on:
  pull_request:
    branches: [main, develop]

jobs:
  check-html-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all HTML files have title tags
        run: |
          for file in *.html; do
            if [ -f "$file" ] && ! grep -qi "<title>" "$file"; then
              echo "ERROR: $file is missing <title> tag"
              exit 1
            fi
          done
          echo "HTML title check passed"

  check-image-alt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check images have alt attributes
        run: |
          if [ -f index.html ]; then
            MISSING=$(grep -in '<img' index.html | grep -vi 'alt=' || true)
            if [ -n "$MISSING" ]; then
              echo "ERROR: Images missing alt attributes:"
              echo "$MISSING"
              exit 1
            fi
          fi
          echo "Image alt check passed"

  check-no-console-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for console.log in JS
        run: |
          if [ -d js ]; then
            if grep -rn "console.log" js/; then
              echo "WARNING: Remove console.log before merging"
              exit 1
            fi
          fi
          echo "No console.log found"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs:
      - check-html-titles
      - check-image-alt
      - check-no-console-log
    steps:
      - name: All checks passed
        run: echo "All PR checks passed! Ready for review."
