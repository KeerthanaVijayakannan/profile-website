
name: Validate HTML & CSS

on:
  push:
    branches: [main, develop, ci/setup-validation]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: |
          npm install -g htmlhint
          npm install -g csslint

      - name: Validate HTML files
        run: |
          if compgen -G "*.html" > /dev/null; then
            htmlhint "*.html" --config .htmlhintrc
          else
            echo "No HTML files yet. Validation will run when frontend is added."
          fi

      - name: Validate CSS files
        run: |
          if compgen -G "css/*.css" > /dev/null; then
            csslint css/*.css --quiet
          else
            echo "No CSS files found."
          fi
