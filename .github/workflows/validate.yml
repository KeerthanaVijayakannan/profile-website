
      - name: Validate CSS files
        run: |
          found=0

          for file in css/*.css; do
            [ -f "$file" ] || continue

            if [ -s "$file" ]; then
              found=1
              csslint "$file" --quiet
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No non-empty CSS files to validate yet."
          fi
